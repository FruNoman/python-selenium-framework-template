[project]
name = "autotests"
version = "0.1.0"
description = "UI test automation: Selenium + pytest, page objects over standard elements, data from JSON, API preconditions with cleanup, failure artifacts."
requires-python = ">=3.12"
dependencies = [
    # the Grid images in docker-compose.grid.yml carry the same version — bump both at once
    "selenium==4.49.0",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "pytest-check==2.9.1",
    "pydantic==2.14.0",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "faker==40.43.0",
    "pytest-timeout==2.4.0",
    "pytest-html==4.1.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff==0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autotests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the framework's fixtures, hooks and options come from one plugin module
addopts = """-ra --strict-markers -p autotests.plugin --junitxml=build/test-results/junit.xml
  --html=build/reports/report.html --self-contained-html"""
# a hung test (a dead Grid session, a wait without end) fails alone instead of holding the run;
# setup counts: the shared-state wait and the API preconditions are inside it
timeout = 300
# a known product bug: @pytest.mark.xfail(strict=True, reason="<the finding>") — it runs every
# time, XFAIL while the bug is there, and a fixed bug turns the run red (XPASS) to drop the marker
xfail_strict = true
markers = [
    "as_user(user): the user the test runs as (default: the least privileged one)",
    "shared_state(key, state): a shared resource of the environment (a global switch) the test needs in a state",
]
log_level = "INFO"
log_format = "%(asctime)s.%(msecs)03d %(levelname)-5s [%(name)s] %(message)s"
log_date_format = "%H:%M:%S"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # en dashes and arrows in prose are intended

[tool.ruff.lint.per-file-ignores]
# test names carry the TMS case id as is: test_LS316_…, test_C123_…
"tests/**" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["autotests"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
